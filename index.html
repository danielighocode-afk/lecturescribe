    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
        background:
          radial-gradient(120% 90% at 88% 0%, rgba(217, 70, 239, 0.45) 0%, rgba(217, 70, 239, 0) 55%),
          radial-gradient(90% 90% at 0% 100%, rgba(124, 58, 237, 0.55) 0%, rgba(124, 58, 237, 0) 60%),
          linear-gradient(160deg, #1b0f40, #2b1a66 60%, #43207f);
        transition: opacity 0.6s ease, visibility 0.6s ease, transform 0.6s ease;
      }
      #splash.out {
        opacity: 0;
        visibility: hidden;
        transform: scale(1.04);
        pointer-events: none;
      }
      .sp-logo-wrap {
        position: relative;
        width: 96px;
        height: 96px;
        animation: sp-pop 0.9s cubic-bezier(0.2, 0.9, 0.25, 1) both;
      }
      .sp-logo {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 28px;
        background: #fff;
        object-fit: cover;
        box-shadow: 0 18px 50px rgba(124, 58, 237, 0.55);
        animation: sp-float 3.2s ease-in-out 0.9s infinite;
      }
      .sp-ring {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        border: 2px solid rgba(232, 121, 249, 0.7);
        animation: sp-ring 2.2s ease-out 0.6s infinite;
      }
      .sp-name {
        margin-top: 26px;
        font: 700 30px/1.1 'Bricolage Grotesque', Figtree, system-ui, sans-serif;
        letter-spacing: -0.01em;
        animation: sp-up 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
      }
      .sp-tag {
        margin-top: 8px;
        font: 500 15px/1.4 Figtree, system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.72);
        animation: sp-up 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.45s both;
      }
      .sp-bar {
        width: 120px;
        height: 4px;
        margin-top: 40px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.16);
        animation: sp-up 0.7s ease 0.6s both;
      }
      .sp-bar i {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, #a78bfa, #e879f9);
        animation: sp-slide 1.15s ease-in-out infinite;
      }
      @keyframes sp-pop {
        from { opacity: 0; transform: scale(0.6) translateY(10px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes sp-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }
      @keyframes sp-ring {
        0% { opacity: 0.8; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.55); }
      }
      @keyframes sp-up {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes sp-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .sp-logo, .sp-ring, .sp-bar i { animation: none; }
      }
    </style>
  </head>
  <body class="bg-bg font-sans text-ink antialiased">
    <div id="splash" aria-hidden="true">
      <div class="sp-logo-wrap">
        <span class="sp-ring"></span>
        <img class="sp-logo" src="./icon-192.png" alt="" width="96" height="96" />
      </div>
      <p class="sp-name">LectureScribe</p>
      <p class="sp-tag">Your lectures, made clearer.</p>
      <div class="sp-bar"><i></i></div>
    </div>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
